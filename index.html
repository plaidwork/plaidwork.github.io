        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Noto Sans SC"', 'sans-serif'],
                    },
                    animation: {
                        'fade-in': 'fadeIn 0.5s ease-out',
                        'slide-in': 'slideIn 0.3s ease-out',
                    },
                    keyframes: {
                        fadeIn: {
                            '0%': { opacity: '0', transform: 'translateY(-20px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' },
                        },
                        slideIn: {
                            '0%': { opacity: '0', transform: 'translateX(20px)' },
                            '100%': { opacity: '1', transform: 'translateX(0)' },
                        }
                    }
                }
            }
        }

    <style>
        /* 滚动条美化 */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(156, 163, 175, 0.5);
            border-radius: 9999px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(107, 114, 128, 0.8);
        }
        
        /* 玻璃拟态 */
        .glass {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
        .glass-dark {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        [v-cloak] { display: none; }

                const handleSearch = () => {
                    if (!searchText.value) return
                    const url = `${currentEngine.value.url}?${currentEngine.value.key}=${encodeURIComponent(searchText.value)}`
                    window.open(url, '_blank')
                    searchText.value = ''
                }

                const fetchHitokoto = async () => {
                    try {
                        const res = await fetch('https://v1.hitokoto.cn/?encode=json')
                        const data = await res.json()
                        hitokoto.value = data.hitokoto
                    } catch (e) {
                        hitokoto.value = "即使是微小的星光，也能照亮夜空。"
                    }
                }

                const loadWeather = () => {
                    window.WIDGET = {
                        "CONFIG": {

                            "background": "5",
                            "tmpColor": "FFFFFF",
                            "tmpSize": "16",
                            "cityColor": "FFFFFF",

                            "fixed": "false",

                            "horizontal": "left",

                        }
                    }
                    const script = document.createElement('script')
                    script.src = 'https://widget.qweather.net/simple/static/js/he-simple-common.js?v=2.0'
                    script.async = true
                    document.body.appendChild(script)
                }

                onMounted(() => {
                    fetchHitokoto()
                    loadWeather()
                    const originTitle = document.title
                    window.onblur = () => { document.title = '(つ ェ ⊂)我藏好了哦~' }
                    window.onfocus = () => {
                        document.title = '(*゜ロ゜)ノ被发现了~'
                        setTimeout(() => { document.title = originTitle }, 3000)
                    }
                })

                return {
                    showDrawer, searchText, hitokoto, engines, currentEngine, links, handleSearch, fetchHitokoto
                }
            }
        }).mount('#app')
